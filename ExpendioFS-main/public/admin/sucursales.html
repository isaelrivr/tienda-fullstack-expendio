<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sucursales - Expendio FS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
 <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-expendio">
  <div class="container">
    <a class="navbar-brand" href="index.html">
      <span class="brand-icon">🍺</span> Expendio FS — Admin
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
        <li class="nav-item"><a class="nav-link" href="sucursales.html"><i class="bi bi-building me-1"></i>Sucursales</a></li>
        <li class="nav-item"><a class="nav-link" href="empleados.html"><i class="bi bi-people me-1"></i>Empleados</a></li>
        <li class="nav-item"><a class="nav-link" href="clientes.html"><i class="bi bi-person me-1"></i>Clientes</a></li>
        <li class="nav-item"><a class="nav-link" href="proveedores.html"><i class="bi bi-truck me-1"></i>Proveedores</a></li>
        <li class="nav-item"><a class="nav-link" href="productos.html"><i class="bi bi-box me-1"></i>Productos</a></li>
        <li class="nav-item"><a class="nav-link" href="ventas.html"><i class="bi bi-receipt me-1"></i>Ventas</a></li>
        <li class="nav-item ms-2"><a class="nav-link btn-tienda" href="../tienda/index.html"><i class="bi bi-shop me-1"></i>Ir a la Tienda</a></li>
      </ul>
    </div>
  </div>
</nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-0" style="color:var(--primary-900);"><i class="bi bi-building me-2"></i>Sucursales</h2>
        <p class="text-muted mb-0" style="font-size:0.875rem;">Gestión de base de clientes</p>
      </div>
      <button class="btn btn-primary-exp" onclick="mostrarFormulario()">
        <i class="bi bi-plus-lg me-1"></i>Nuevo Cliente
      </button>
    </div>

    <div class="form-card d-none" id="seccionFormulario">
      <h5 id="formTitle"><i class="bi bi-plus-circle me-2"></i>Agregar Cliente</h5>
      <form id="formsucursales">
        <div class="row g-3" id="camposForm"></div>
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary-exp"><i class="bi bi-save me-1"></i>Guardar</button>
          <button type="button" class="btn btn-outline-secondary" onclick="ocultarFormulario()"><i class="bi bi-x me-1"></i>Cancelar</button>
        </div>
      </form>
    </div>

    <div class="tabla-gestion">
      <table class="table mb-0">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Email</th><th>Teléfono</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <footer class="footer-expendio mt-5">
    <div class="container">
      <div class="d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
        <span class="fw-bold text-white fs-6">🍺 Expendio FS</span>
        <ul class="list-inline mb-0">
          <li class="list-inline-item"><a href="index.html">Inicio</a></li>
          <li class="list-inline-item ms-3"><a href="tienda.html">Tienda</a></li>
        </ul>
      </div>
      <hr class="footer-divider">
      <p class="text-center mb-0" style="font-size:0.8rem;">© 2025 Expendio de Bebidas.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function mostrarFormulario() {
      document.getElementById('seccionFormulario').classList.remove('d-none');
      document.getElementById('seccionFormulario').scrollIntoView({ behavior: 'smooth' });
    }
    function ocultarFormulario() {
      document.getElementById('seccionFormulario').classList.add('d-none');
    }
  </script>
  <script src="/js/sucursales.js"></script>
</body>
</html>
