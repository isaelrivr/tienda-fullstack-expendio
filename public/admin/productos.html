<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

    <div class="container">
      <a class="navbar-brand" href="index.html"><span class="brand-icon">🍺</span> Expendio FS — Admin</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-1">
          <li class="nav-item"><a class="nav-link" href="sucursales.html"><i class="bi bi-building me-1"></i>Sucursales</a></li>
          <li class="nav-item"><a class="nav-link" href="empleados.html"><i class="bi bi-people me-1"></i>Empleados</a></li>
          <li class="nav-item"><a class="nav-link" href="clientes.html"><i class="bi bi-person me-1"></i>Clientes</a></li>
          <li class="nav-item"><a class="nav-link" href="proveedores.html"><i class="bi bi-truck me-1"></i>Proveedores</a></li>
          <li class="nav-item"><a class="nav-link active" href="productos.html"><i class="bi bi-box me-1"></i>Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="ventas.html"><i class="bi bi-receipt me-1"></i>Ventas</a></li>
          <li class="nav-item ms-2"><a class="nav-link btn-tienda" href="../tienda/index.html"><i class="bi bi-shop me-1"></i>Ir a la Tienda</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-0" style="color:var(--primary-900);"><i class="bi bi-box me-2"></i>Productos</h2>
        <p class="text-muted mb-0" style="font-size:0.875rem;">Inventario, precios y existencias</p>
      </div>
      <button class="btn btn-primary-exp" id="btnNuevo"><i class="bi bi-plus-lg me-1"></i>Nuevo Producto</button>
    </div>

    <div class="form-card d-none" id="seccionFormulario">
      <h5 id="formTitle"><i class="bi bi-plus-circle me-2"></i>Nuevo Producto</h5>
      <form id="formproductos">
        <div class="row g-3">
          <div class="col-md-2">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">ID <span class="badge bg-secondary ms-1" style="font-size:0.65rem;">Auto</span></label>
            <input type="number" id="id" class="form-control form-control-sm" readonly tabindex="-1">
          </div>
          <div class="col-md-4">
            <!-- Proveedor: SELECT poblado desde API -->
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Proveedor</label>
            <select id="proveedor_id" class="form-select form-select-sm">
              <option value="">— Sin proveedor —</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Categoría <span class="text-danger">*</span></label>
            <select id="categoria" class="form-select form-select-sm" required>
              <option value="">— Categoría —</option>
              <option value="Cerveza">🍺 Cerveza</option>
              <option value="Vino">🍷 Vino</option>
              <option value="Whisky">🥃 Whisky</option>
              <option value="Ron">🍹 Ron</option>
              <option value="Vodka">🍸 Vodka</option>
              <option value="Tequila">🥂 Tequila</option>
              <option value="Brandy">🥃 Brandy</option>
              <option value="Mezcal">🌵 Mezcal</option>
              <option value="Refresco">🥤 Refresco</option>
              <option value="Agua">💧 Agua</option>
              <option value="Botana">🍿 Botana</option>
              <option value="Otro">📦 Otro</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Unidad de medida</label>
            <select id="unidad_medida" class="form-select form-select-sm">
              <option value="Pieza">Pieza</option>
              <option value="Litro">Litro</option>
              <option value="ML">Mililitro (ML)</option>
              <option value="Six-Pack">Six-Pack</option>
              <option value="Caja">Caja</option>
              <option value="Paquete">Paquete</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Nombre del producto <span class="text-danger">*</span></label>
            <input type="text" id="nombre" class="form-control form-control-sm" placeholder="Ej. Corona 355ml" required>
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Marca</label>
            <input type="text" id="marca" class="form-control form-control-sm" placeholder="Ej. Corona">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Código de barras</label>
            <input type="text" id="codigo_barras" class="form-control form-control-sm" placeholder="0000000000000">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Estado</label>
            <select id="activo" class="form-select form-select-sm">
              <option value="1">✅ Activo</option>
              <option value="0">❌ Inactivo</option>
            </select>
          </div>
          <div class="col-md-5">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Descripción</label>
            <input type="text" id="descripcion" class="form-control form-control-sm" placeholder="Descripción breve del producto">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Costo ($)</label>
            <input type="number" id="costo" class="form-control form-control-sm" placeholder="0.00" step="0.01" min="0">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Precio ($) <span class="text-danger">*</span></label>
            <input type="number" id="precio" class="form-control form-control-sm" placeholder="0.00" step="0.01" min="0" required>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Stock <span class="badge bg-secondary ms-1" style="font-size:0.65rem;">Default 0</span></label>
            <input type="number" id="stock" class="form-control form-control-sm" value="0" min="0">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Stock mínimo</label>
            <input type="number" id="stock_minimo" class="form-control form-control-sm" value="5" min="0">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold" style="font-size:0.82rem;">Fecha caducidad</label>
            <input type="date" id="fecha_caducidad" class="form-control form-control-sm">
          </div>
        </div>
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary-exp"><i class="bi bi-save me-1"></i>Guardar</button>
          <button type="button" class="btn btn-outline-secondary" id="btnCancel"><i class="bi bi-x me-1"></i>Cancelar</button>
        </div>
      </form>
    </div>

    <div class="tabla-gestion">
      <table class="table mb-0">
        <thead>
          <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Marca</th><th>Precio</th><th>Stock</th><th>Estado</th><th>Acciones</th></tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <footer class="footer-expendio mt-5">
    <div class="container">
      <div class="d-flex flex-column flex-lg-row align-items-center justify-content-between gap-3">
        <span class="fw-bold text-white fs-6">🍺 Expendio FS</span>

          <li class="list-inline-item"><a href="index.html">Inicio</a></li>

      <hr class="footer-divider">
      <p class="text-center mb-0" style="font-size:0.8rem;">© 2025 Expendio de Bebidas.</p>
    </div>
  </footer>

  <script src="js/productos.js"></script>
</body>
</html>
